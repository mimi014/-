<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <title>YouTube文字起こし - Transcriber</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 11H9.5v-2h-2v2H6V9h1.5v2.5h2V9H11v6zm7-1c0 .55-.45 1-1 1h-.75v1.5h-1.5V15H14c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v4zm-3.5-.5h2v-3h-2v3z"/>
                </svg>
                <h1>Transcriber</h1>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="テーマ切り替え">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- URL入力セクション -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input
                        type="url"
                        id="youtubeUrl"
                        class="url-input"
                        placeholder="YouTube URLを貼り付け..."
                        autocomplete="off"
                        inputmode="url"
                    >
                    <button id="fetchBtn" class="fetch-btn">
                        <span class="btn-text">文字起こし</span>
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">YouTubeの動画URLを入力して、字幕を取得します</p>
            </section>

            <!-- ローディング -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>字幕を取得中...</p>
            </div>

            <!-- エラー表示 -->
            <div id="error" class="error-message hidden">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <p id="errorText"></p>
            </div>

            <!-- 動画情報 -->
            <section id="videoInfo" class="video-info hidden">
                <div class="video-thumbnail">
                    <img id="thumbnail" src="" alt="動画サムネイル">
                </div>
                <div class="video-details">
                    <h2 id="videoTitle"></h2>
                    <p id="channelName"></p>
                </div>
            </section>

            <!-- 言語選択 -->
            <section id="languageSection" class="language-section hidden">
                <label for="languageSelect">字幕言語:</label>
                <select id="languageSelect" class="language-select">
                    <option value="">言語を選択...</option>
                </select>
            </section>

            <!-- 文字起こし結果 -->
            <section id="transcriptSection" class="transcript-section hidden">
                <div class="transcript-header">
                    <h3>文字起こし結果</h3>
                    <div class="transcript-actions">
                        <button id="copyBtn" class="action-btn" title="コピー">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                            </svg>
                            <span>コピー</span>
                        </button>
                        <button id="downloadBtn" class="action-btn" title="ダウンロード">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                            </svg>
                            <span>保存</span>
                        </button>
                        <button id="timestampToggle" class="action-btn active" title="タイムスタンプ表示切替">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                            </svg>
                            <span>時間</span>
                        </button>
                    </div>
                </div>
                <div id="transcriptContent" class="transcript-content">
                    <!-- 文字起こしテキストがここに表示される -->
                </div>
            </section>
        </main>

        <!-- フッター -->
        <footer class="footer">
            <p>YouTube Transcriber - 動画の字幕を簡単に取得</p>
        </footer>

        <!-- トースト通知 -->
        <div id="toast" class="toast hidden">
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
